name: lint

# Quoted so YAML does not read `on` as boolean true.
"on":
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint
