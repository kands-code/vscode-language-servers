name: release

# `on` is quoted to avoid YAML 1.1 parsers coercing it to boolean `true`.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'VS Code version to extract (e.g. 1.133.0). Leave empty for the latest stable.'
        required: false
        type: string
      force:
        description: 'Rebuild and overwrite the release even if it already exists.'
        required: false
        type: boolean
        default: false
  schedule:
    # Check for a new stable release twice a day (02:23 and 14:23 UTC).
    - cron: '23 2,14 * * *'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve VS Code version
        id: resolve
        run: |
          VERSION="$(deno run --allow-net scripts/resolve-version.ts '${{ github.event.inputs.version }}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vscode-${{ steps.resolve.outputs.version }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force flag set: rebuilding."
          # Check the git tag (not just the release), because `gh release create`
          # fails if a tag exists even when no release is attached to it.
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build language servers (Node tarballs)
        if: steps.check.outputs.skip == 'false'
        run: deno run --allow-all scripts/build.ts "${{ steps.resolve.outputs.version }}"

      - name: Prepare JSR package
        if: steps.check.outputs.skip == 'false'
        run: deno run --allow-all scripts/prepare-jsr.ts "${{ steps.resolve.outputs.version }}"

      - name: Publish to JSR
        if: steps.check.outputs.skip == 'false'
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
        run: |
          if [ -z "$DENO_AUTH_TOKEN" ]; then
            echo "DENO_AUTH_TOKEN secret is not set; skipping JSR publish."
          else
            set -o pipefail
            cd jsr
            if deno publish --no-check --allow-dirty 2>&1 | tee /tmp/jsr-publish.log; then
              echo "Published to JSR."
            elif grep -qiE "already (been )?published|already exists" /tmp/jsr-publish.log; then
              echo "JSR version already published; continuing."
            else
              exit 1
            fi
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          TAG="vscode-$VERSION"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          fi
          gh release create "$TAG" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "VS Code $VERSION language servers" \
            --notes "Extracted from microsoft/vscode at tag \`$VERSION\`. See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for usage."
