name: publish

# `on` is quoted to avoid YAML 1.1 parsers coercing it to boolean `true`.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "JSR version to publish (e.g. 1.133.1 or 1.133.0-hotfix.1). Leave empty for the latest VS Code stable."
        required: false
        type: string
      vscode_tag:
        description: "VS Code git tag to extract from (e.g. 1.133.0). Leave empty for the latest stable. Set explicitly when publishing a hotfix of an older release."
        required: false
        type: string
  schedule:
    # Check for a new stable release twice a day (02:23 and 14:23 UTC).
    - cron: "23 2,14 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Resolve versions
        id: resolve
        run: |
          LATEST="$(deno run --allow-net scripts/resolve-version.ts '')"
          # VS Code git tag to extract from.
          CLONE="${{ github.event.inputs.vscode_tag }}"
          [ -z "$CLONE" ] && CLONE="$LATEST"
          # JSR package version (may carry a hotfix suffix).
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="$CLONE"
          echo "clone=$CLONE" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved: vscode_tag=$CLONE jsr_version=$VER"

      - name: Check if version already published
        id: check
        run: |
          VER="${{ steps.resolve.outputs.version }}"
          if curl -sf "https://jsr.io/@qarks/vscode-language-servers/meta.json" | grep -q "\"$VER\""; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "JSR version $VER already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare JSR package
        if: steps.check.outputs.skip == 'false'
        run: deno run --allow-all scripts/prepare-jsr.ts "${{ steps.resolve.outputs.clone }}" "${{ steps.resolve.outputs.version }}"

      - name: Publish to JSR
        if: steps.check.outputs.skip == 'false'
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
        run: |
          cd jsr
          deno publish --no-check --allow-dirty
