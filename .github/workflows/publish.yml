name: publish

# `on` is quoted to avoid YAML 1.1 parsers coercing it to boolean `true`.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "VS Code version to extract (e.g. 1.133.0). Leave empty for the latest stable."
        required: false
        type: string
  schedule:
    # Check for a new stable release twice a day (02:23 and 14:23 UTC).
    - cron: "23 2,14 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Resolve VS Code version
        id: resolve
        run: |
          VERSION="$(deno run --allow-net scripts/resolve-version.ts '${{ github.event.inputs.version }}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          if curl -sf "https://jsr.io/@qarks/vscode-language-servers/meta.json" | grep -q "\"$VERSION\""; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "JSR version $VERSION already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare JSR package
        if: steps.check.outputs.skip == 'false'
        run: deno run --allow-all scripts/prepare-jsr.ts "${{ steps.resolve.outputs.version }}"

      - name: Publish to JSR
        if: steps.check.outputs.skip == 'false'
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
        run: |
          cd jsr
          deno publish --no-check --allow-dirty
