name: publish

# Quoted so YAML does not read `on` as boolean true.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.140.0 or 1.140.0-hotfix.1). Leave empty for the latest VS Code stable."
        required: false
        type: string
      vscode_tag:
        description: "VS Code git tag to extract from (e.g. 1.140.0). Leave empty for the latest stable. Set explicitly when releasing a hotfix of an older version."
        required: false
        type: string
  schedule:
    # Check for a new stable release once a week (Mondays 02:23 UTC).
    - cron: "23 2 * * 1"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Check formatting and lint
        run: |
          npm run format
          npm run lint

      - name: Resolve versions
        id: resolve
        run: |
          # Only query the update API when the VS Code tag is not pinned.
          if [ -z "${{ github.event.inputs.vscode_tag }}" ]; then
            LATEST="$(node --experimental-strip-types scripts/resolve-version.ts)"
          else
            LATEST=""
          fi
          CLONE="${{ github.event.inputs.vscode_tag }}"
          [ -z "$CLONE" ] && CLONE="$LATEST"
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="$CLONE"
          echo "clone=$CLONE" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved: vscode_tag=$CLONE version=$VER"

      - name: Skip if already released
        id: check
        run: |
          VER="${{ steps.resolve.outputs.version }}"
          CHECK="$(node --experimental-strip-types scripts/version-exists.ts "$VER")"
          echo "$CHECK" >> "$GITHUB_OUTPUT"
          echo "$CHECK"

      - name: Extract VS Code sources
        if: steps.check.outputs.skip == 'false'
        run: node --experimental-strip-types scripts/extract.ts "${{ steps.resolve.outputs.clone }}"

      - name: Type-check sources
        if: steps.check.outputs.skip == 'false'
        run: npm run check

      - name: Bundle language servers
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Smoke test language servers
        if: steps.check.outputs.skip == 'false'
        run: npm run smoke

      - name: Commit release and tag
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.resolve.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VER" --no-git-tag-version
          # Keep the README install example on the released tag.
          sed -i -E "s#(archive/refs/tags/)[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\.tar\.gz)#\1${VER}\3#" README.md
          git add package.json package-lock.json README.md dist lib LICENSE.vscode.txt
          git commit -m "Release $VER (VS Code ${{ steps.resolve.outputs.clone }})"
          git tag "$VER"
          git push origin HEAD "$VER"
