name: publish

# Quoted so YAML does not read `on` as boolean true.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "JSR version to publish (e.g. 1.133.1 or 1.133.0-hotfix.1). Leave empty for the latest VS Code stable."
        required: false
        type: string
      vscode_tag:
        description: "VS Code git tag to extract from (e.g. 1.133.0). Leave empty for the latest stable. Set explicitly when publishing a hotfix of an older release."
        required: false
        type: string
  schedule:
    # Check for a new stable release twice a day (02:23 and 14:23 UTC).
    - cron: "23 2,14 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Resolve versions
        id: resolve
        run: |
          # Only query the update API when the VS Code tag is not pinned.
          if [ -z "${{ github.event.inputs.vscode_tag }}" ]; then
            LATEST="$(deno run --allow-net scripts/resolve-version.ts)"
          else
            LATEST=""
          fi
          CLONE="${{ github.event.inputs.vscode_tag }}"
          [ -z "$CLONE" ] && CLONE="$LATEST"
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="$CLONE"
          echo "clone=$CLONE" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved: vscode_tag=$CLONE jsr_version=$VER"

      - name: Skip if already published
        id: check
        run: |
          VER="${{ steps.resolve.outputs.version }}"
          CHECK="$(deno run --allow-net scripts/jsr-version-exists.ts "$VER")"
          echo "$CHECK" >> "$GITHUB_OUTPUT"
          echo "$CHECK"

      - name: Prepare JSR package
        if: steps.check.outputs.skip == 'false'
        run: deno run --allow-all scripts/prepare-jsr.ts "${{ steps.resolve.outputs.clone }}" "${{ steps.resolve.outputs.version }}"

      - name: Type-check generated package
        if: steps.check.outputs.skip == 'false'
        run: |
          cd jsr
          deno check css/node/cssServerMain.ts html/node/htmlServerMain.ts json/node/jsonServerMain.ts

      - name: Smoke test language servers
        if: steps.check.outputs.skip == 'false'
        run: deno run --allow-all scripts/smoke-test.ts

      - name: Publish to JSR
        if: steps.check.outputs.skip == 'false'
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
        run: |
          cd jsr
          deno publish --check --allow-dirty
